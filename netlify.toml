[build]
  command = "pnpm --filter @workspace/fly365-algarve run build"
  publish = "artifacts/fly365-algarve/dist/public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "frame-ancestors 'self' https://fly365algarve.co.uk https://www.fly365algarve.co.uk http://fly365algarve.co.uk http://www.fly365algarve.co.uk"
